services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecom_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_memory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecom_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_memory_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecom_agent_orders
      MYSQL_USER: ecom
      MYSQL_PASSWORD: ecom_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      # 本机 MySQL80 已占用 3306，容器映射到 3307。
      - "3307:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_order_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_memory_data:
  redis_memory_data:
  mysql_order_data:
