# 数据配置片段：合并到自己的 LLaMA-Factory SFT 配置；不是完整训练配置。
# model_name_or_path、template、LoRA 和训练超参数由所选模型的配置提供。
# dataset_dir 是相对启动训练时的工作目录；在其他目录训练时改为绝对路径。
dataset_dir: data/fine_tuning/multiturn_intent_sft
dataset: ecom_intent_v4_train
eval_dataset: ecom_intent_v4_dev
val_size: 0.0

# 必须只监督末轮分类答案，不能学习历史客服回复。
mask_history: true
train_on_prompt: false
packing: false
overwrite_cache: true

# 完整 31 类 system prompt 较长；实际长度须用所选模型的 tokenizer 检查。
# 不要直接沿用默认 2048 而截掉提示词或必要的多轮上下文。
cutoff_len: 8192

# test_v4_sharegpt.jsonl 仅用于最终独立评测，不加入训练或选模型。
# 最终评测时单独选择 eval_dataset: ecom_intent_v4_test。
# system prompt 已在每条 conversations 的第一项，不再手动重复添加。
# 数据格式参照：https://github.com/hiyouga/LLaMA-Factory/blob/main/data/README.md
# mask_history：https://github.com/hiyouga/LLaMA-Factory/blob/main/src/llamafactory/hparams/data_args.py
