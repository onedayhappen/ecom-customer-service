<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海风骑行 · 鹈鹕的慢时光</title>
<style>
:root{color-scheme:light;--ink:#253d38;--muted:#728079;--paper:#faf8ef;--green:#244f42}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:40px 24px}
main{width:min(1120px,100%)}header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:0 12px 25px}.eyebrow{font-size:11px;letter-spacing:.25em;font-weight:700;color:#71846b;margin:0 0 14px}h1{font-size:clamp(26px,4vw,42px);font-weight:600;letter-spacing:.06em;margin:0}header p:last-child{font-size:13px;line-height:1.8;color:var(--muted);margin:12px 0 0}.edition{font-size:11px;letter-spacing:.13em;white-space:nowrap;padding-bottom:6px;color:#849084}.scene{position:relative;border-radius:24px;overflow:hidden;background:#e4eee2;box-shadow:0 14px 48px #4053330c;border:1px solid #dce4d5}svg{display:block;width:100%;height:auto}.badge{position:absolute;top:25px;left:30px;font-size:10px;letter-spacing:.16em;display:flex;gap:9px;align-items:center;color:#4b695b}.badge:before{content:"";width:6px;height:6px;border-radius:100%;background:#698468}.scene-caption{position:absolute;bottom:24px;right:29px;font-size:11px;letter-spacing:.15em;color:#688069}.controls{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:24px 12px 0}.play{border:0;background:var(--green);color:white;border-radius:100px;padding:13px 21px;cursor:pointer;font:inherit;font-size:12px;display:flex;gap:10px;align-items:center;min-width:115px;justify-content:center;transition:background .2s,transform .2s}.play:hover{background:#366554;transform:translateY(-1px)}.play:focus-visible,input:focus-visible{outline:3px solid #dca04e;outline-offset:5px}.speed{display:flex;align-items:center;gap:14px;font-size:11px;color:#6b7d70}.speed input{width:130px;accent-color:var(--green);cursor:pointer}.speed output{width:32px;font-variant-numeric:tabular-nums;color:var(--ink)}.footnote{font-size:11px;letter-spacing:.04em;color:#8b9485;margin-left:auto}.icon{font-size:13px;width:12px}.footer{display:flex;justify-content:space-between;margin:32px 12px 0;border-top:1px solid #e0e5d8;padding-top:14px;color:#96a08e;font-size:9px;letter-spacing:.18em}
@media(max-width:600px){body{padding:27px 14px}header{margin:0 5px 20px}.edition,.footnote{display:none}.scene{border-radius:18px}svg{min-height:360px;object-fit:cover}.badge{top:17px;left:19px;font-size:8px}.scene-caption{font-size:8px;bottom:17px;right:17px}.controls{margin:21px 4px 0;gap:14px}.speed{gap:8px}.speed input{width:95px}.play{padding:12px 15px;min-width:102px}.footer{margin-top:26px;font-size:8px}}
</style>
</head>
<body>
<main>
<header><div><p class="eyebrow">A LITTLE RIDE BY THE SEA</p><h1>慢慢骑，刚刚好。</h1><p>一只鹈鹕，一辆单车，还有不赶时间的海风。</p></div><span class="edition">COASTAL DAYS &nbsp; / &nbsp; No. 001</span></header>
<section class="scene" aria-label="鹈鹕骑自行车的二维动画">
<div class="badge">海边骑行俱乐部</div>
<svg id="art" viewBox="0 0 1000 610" role="img" aria-labelledby="art-title art-desc" xmlns="http://www.w3.org/2000/svg">
<title id="art-title">鹈鹕骑着绿色自行车沿海岸前进</title>
<desc id="art-desc">暖黄色长喙的白色鹈鹕交替踩踏，车轮旋转，围巾随风摆动，草丛和路面向后移动。可使用下方按钮暂停，或调节骑行速度。</desc>
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e7eee2"/><stop offset="1" stop-color="#f4f3dd"/></linearGradient>
<linearGradient id="sea" x2="0" y2="1"><stop stop-color="#a8c8bd"/><stop offset="1" stop-color="#bdd4c4"/></linearGradient>
<linearGradient id="feather" x2=".8" y2="1"><stop stop-color="#fffef5"/><stop offset="1" stop-color="#e3e6d6"/></linearGradient>
<linearGradient id="pouch" x2="0" y2="1"><stop stop-color="#f3b84c"/><stop offset="1" stop-color="#e58b3e"/></linearGradient>
<g id="cloud" fill="#fffdf0" opacity=".73"><path d="M0 20c-6-15 15-24 26-15 3-21 39-23 44 0 21-8 37 9 31 15Z"/></g>
<g id="tuft" fill="none" stroke="#7b9467" stroke-width="3" stroke-linecap="round"><path d="M0 0q-4-20-12-24M0 0q5-26 13-31M1 0q15-14 25-12"/></g>
<g id="wheel">
<circle r="82" fill="#f5f0d9" fill-opacity=".48" stroke="#2e4640" stroke-width="10"/>
<circle r="73" fill="none" stroke="#b2b9a1" stroke-width="2"/>
<g stroke="#98aa98" stroke-width="1.5" opacity=".8">
<path d="M-71 0H71M0-71V71M-50-50 50 50M-50 50 50-50M-27-66 27 66M-66-27 66 27M-66 27 66-27M-27 66 27-66"/>
</g><circle r="8" fill="#eff0d9" stroke="#4f6b58" stroke-width="4"/>
<circle cx="50" cy="-50" r="3.5" fill="#e8ad55"/>
</g>
<g id="flower"><path d="M0 0v-19" stroke="#7c9569" stroke-width="2"/><g fill="#f2d174"><circle cy="-23" r="5"/><circle cx="-5" cy="-18" r="5"/><circle cx="5" cy="-18" r="5"/></g><circle cy="-19" r="3" fill="#c89449"/></g>
</defs>
<!-- Open, softly colored coastal landscape. -->
<path fill="url(#sky)" d="M0 0H1000V610H0Z"/>
<circle cx="778" cy="133" r="59" fill="#f1d58b"/>
<circle cx="778" cy="133" r="75" fill="none" stroke="#f1d58b" stroke-opacity=".22" stroke-width="17"/>
<g id="clouds"><use href="#cloud" x="100" y="117"/><use href="#cloud" x="355" y="74" transform="scale(.85)"/><use href="#cloud" x="910" y="120"/><use href="#cloud" x="1300" y="95"/></g>

<path d="M0 321Q120 298 247 321T475 314Q650 280 820 315T1000 306V391H0Z" fill="#b7cbb4"/>
<path d="M0 332Q500 326 1000 332V420H0Z" fill="url(#sea)"/>

<g id="gulls" fill="none" stroke="#7d9587" stroke-width="2.5" stroke-linecap="round"><path id="gull1" d="M140 190q9-9 18 0 9-9 18 0"/><path id="gull2" d="M810 233q7-7 14 0 7-7 14 0"/></g>
<path d="M0 410Q250 365 500 407T1000 394V610H0Z" fill="#d7d8b1"/>
<path d="M0 443Q300 420 1000 441V554H0Z" fill="#efe4c7"/>
<path d="M0 551Q480 542 1000 558V610H0Z" fill="#c7cda3"/>
<path d="M0 444Q430 427 1000 442" fill="none" stroke="#f8f0da" stroke-width="5"/>
<g id="ground"><g fill="#d2c6a7"><rect x="20" y="485" width="44" height="3" rx="2"/><rect x="210" y="525" width="70" height="3" rx="2"/><rect x="540" y="483" width="33" height="3" rx="2"/><rect x="800" y="525" width="52" height="3" rx="2"/><rect x="1020" y="485" width="44" height="3" rx="2"/><rect x="1210" y="525" width="70" height="3" rx="2"/><rect x="1540" y="483" width="33" height="3" rx="2"/><rect x="1800" y="525" width="52" height="3" rx="2"/></g></g>
<g id="grass"><use href="#tuft" x="100" y="430"/><use href="#tuft" x="880" y="443"/><use href="#flower" x="827" y="438"/><use href="#tuft" x="1100" y="430"/><use href="#tuft" x="1880" y="443"/><use href="#flower" x="1827" y="438"/></g>
<ellipse id="shadow" cx="505" cy="544" rx="211" ry="12" fill="#788268" opacity=".16"/>
<!-- Rear leg sits behind the bicycle frame. -->
<g id="backLeg" fill="none" stroke="#c88b42" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path id="backLegPath"/></g>
<g transform="translate(356 453)"><g id="rearWheel"><use href="#wheel"/></g></g>
<g transform="translate(653 453)"><g id="frontWheel"><use href="#wheel"/></g></g>
<!-- Bicycle: fenders, triangular frame, chain, fork, saddle and handlebars. -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M269 434a90 90 0 0 1 174-7M568 426a90 90 0 0 1 171 7" stroke="#849b73" stroke-width="5"/>
<path d="M356 453 448 339 497 439 356 453M448 339 607 339 497 439M607 339 653 453" stroke="#244f42" stroke-width="10"/>
<path d="M448 339 607 339" stroke="#62826b" stroke-width="3"/>
<path d="M448 339 441 315M607 339 595 301 619 284" stroke="#526f5d" stroke-width="7"/>
<path d="M607 285h34q16 0 16 13t-13 13" stroke="#314d42" stroke-width="6"/>
<path d="M638 285h8q12 0 12 13" stroke="#ba8555" stroke-width="8"/>
<path d="M497 421 358 442q-15 12 0 22L497 458" stroke="#7a8972" stroke-width="3"/>
<path d="M650 306q-35 6-31 53" stroke="#8c9e82" stroke-width="2"/>
</g>
<path d="M418 305q9-6 25-3l27 4q9 3 4 10h-55q-11-3-1-11" fill="#77583e"/>
<path d="M422 305h31" stroke="#b69464" stroke-width="3" stroke-linecap="round"/>
<circle cx="497" cy="439" r="22" fill="#e5e5cc" stroke="#5b7661" stroke-width="4"/>
<circle cx="497" cy="439" r="13" fill="none" stroke="#b0b79b" stroke-width="2"/>
<g id="cranks" stroke="#334d41" stroke-width="5" stroke-linecap="round"><path d="M467 439H527"/></g>
<circle cx="497" cy="439" r="5" fill="#324e41"/>
<!-- Rider silhouette: tail, belly, long curved neck and oversized gular pouch. -->
<g id="rider">
<path d="m400 271-41-32 12 34-29-8 38 35" fill="#e5e9db" stroke="#d5ddcd" stroke-width="2"/>
<path d="M385 255C418 223 477 221 506 247c29 25 16 66-14 79-24 11-81-2-102-28-12-16-16-29-5-43Z" fill="url(#feather)"/>
<path d="M479 260c28-13 49-38 47-65-3-31 10-53 40-53 27 0 47 17 47 37l-8 22c-15 8-25 6-31-6 0 34-12 76-47 97Z" fill="url(#feather)"/>
<path d="M542 150q-6-15-19-19 19-1 32 12M552 145q-1-18-11-23 20 2 25 21" fill="#fffef5"/>
<path d="M607 181 744 198q12 1 14 8c-39 32-91 49-125 18-11-10-19-25-26-43Z" fill="url(#pouch)"/>
<path d="M610 178q57 3 137 20 10 3 11 8L610 195Z" fill="#f6c35e"/>
<path d="m616 195 133 10" fill="none" stroke="#c88737" stroke-width="2.5" stroke-linecap="round"/>
<path d="M625 207q18 24 43 20" fill="none" stroke="#fbd080" stroke-width="3" stroke-linecap="round" opacity=".8"/>
<ellipse cx="592" cy="170" rx="9" ry="10" fill="#e3e7d7"/><circle cx="594" cy="170" r="5" fill="#2d4038"/><circle cx="595.5" cy="168.5" r="1.6" fill="#fff"/>
<path d="M583 155q6-4 13-1" fill="none" stroke="#8a9c85" stroke-width="2.5" stroke-linecap="round"/>
<!-- Rust-red scarf, with a trailing ribbon animated independently. -->
<path id="scarfTail" d="M530 235c-29-10-47-21-75-12l7 10-12 6c32-6 49 13 72 14Z" fill="#c56a49"/>
<path d="M529 224q15 10 36 10l-5 13q-18 1-39-11Z" fill="#d77d55"/>
<path d="M542 234q8 5 16 4" fill="none" stroke="#eda078" stroke-width="3"/>
<!-- Long wing reaches the handlebar. -->
<path d="M419 260c27-15 54-6 79 7 32 17 58 20 96 18l30 8q8 4 0 9c-51 9-91 5-127-8-28 6-63-2-78-34Z" fill="#eef0e2" stroke="#d6dfcd" stroke-width="2"/>
<path d="M428 272q29 18 61 14m-49-3q20 13 42 12m20-12q46 15 96 10" fill="none" stroke="#c7d3bf" stroke-width="2" stroke-linecap="round"/>
</g>
<g fill="none" stroke="#e2a24f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path id="frontLegPath"/></g>
<g id="backFoot"><path d="M-8-4 9-4l15 10H-7Z" fill="#c48940"/><path d="M-12 10h36" stroke="#314b41" stroke-width="5" stroke-linecap="round"/></g>
<g id="frontFoot"><path d="M-8-4 9-4l15 10H-7Z" fill="#edae54"/><path d="m4-2 7 8m0-7 8 7" stroke="#cd8d3d" stroke-width="1.4"/><path d="M-12 10h36" stroke="#314b41" stroke-width="5" stroke-linecap="round"/></g>
<g id="foreground"><use href="#tuft" x="46" y="590" transform="translate(0 -15)"/><use href="#tuft" x="746" y="589"/><use href="#flower" x="715" y="580"/><use href="#tuft" x="1046" y="590" transform="translate(0 -15)"/><use href="#tuft" x="1746" y="589"/><use href="#flower" x="1715" y="580"/></g>
<!-- Small hand-drawn breeze marks. -->
<g id="breeze" stroke="#fbfcf0" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M280 234h37m-60 14h25m-34 38h44"/></g>
</svg>
<div class="scene-caption">跟着海风，向前一点点。</div>
</section>
<div class="controls">
<button class="play" id="toggle" type="button" aria-pressed="false"><span class="icon" id="playIcon" aria-hidden="true">Ⅱ</span><span id="playLabel">歇一会儿</span></button>
<label class="speed" for="speed">骑行速度 <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1"><output id="speedValue" for="speed">1.0×</output></label>
<span class="footnote">今天的目的地，是好心情。</span>
</div>
<div class="footer"><span>PELICAN CYCLING CLUB</span><span>SVG ANIMATION · MADE FOR A SLOW DAY</span></div>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let paused = reducedMotion.matches, speed = 1, time = 0, previous = null;
  const nodes = Object.fromEntries(['rearWheel','frontWheel','cranks','rider','backLegPath','frontLegPath','backFoot','frontFoot','ground','grass','foreground','clouds','ripples','shadow','scarfTail','gulls','breeze'].map(id => [id,$(id)]));
  function syncButton() {
    $('toggle').setAttribute('aria-pressed', String(paused));
    $('playIcon').textContent = paused ? '▶' : 'Ⅱ';
    $('playLabel').textContent = paused ? '继续出发' : '歇一会儿';
    $('toggle').setAttribute('aria-label', paused ? '播放骑行动画' : '暂停骑行动画');
  }
  $('toggle').addEventListener('click', () => { paused = !paused; syncButton(); });
  $('speed').addEventListener('input', event => { speed = Number(event.target.value); $('speedValue').value = speed.toFixed(1) + '×'; });
  reducedMotion.addEventListener('change', event => { if(event.matches) { paused = true; syncButton(); } });
  document.addEventListener('visibilitychange', () => { previous = null; });
  function leg(phase, bob, path, foot, back) {
    const x = 497 + 30 * Math.cos(phase), y = 439 + 30 * Math.sin(phase);
    const hx = back ? 466 : 479, hy = 314 + bob;
    const dx = x - hx, dy = y - hy, d = Math.hypot(dx,dy);
    const l1 = 86, l2 = 88;
    const a = Math.atan2(dy,dx) - Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));
    const kx = hx + l1 * Math.cos(a), ky = hy + l1 * Math.sin(a);
    path.setAttribute('d', 'M'+hx+' '+hy+' L'+kx+' '+ky+' L'+x+' '+(y-7));
    foot.setAttribute('transform','translate('+x+' '+(y-7)+')');
  }
  function render(t) {
    const phase = t * 3.9, bob = Math.sin(phase*2) * 2.2;
    const angle = t * 150;
    nodes.rearWheel.setAttribute('transform','rotate('+angle+')');
    nodes.frontWheel.setAttribute('transform','rotate('+angle+')');
    nodes.cranks.setAttribute('transform','rotate('+(phase*180/Math.PI)+' 497 439)');
    nodes.rider.setAttribute('transform','translate(0 '+bob+')');
    leg(phase+Math.PI,bob,nodes.backLegPath,nodes.backFoot,true);
    leg(phase,bob,nodes.frontLegPath,nodes.frontFoot,false);
    nodes.ground.setAttribute('transform','translate('+(-(t*150)%1000)+' 0)');
    nodes.grass.setAttribute('transform','translate('+(-(t*115)%1000)+' 0)');
    nodes.foreground.setAttribute('transform','translate('+(-(t*185)%1000)+' 0)');
    nodes.clouds.setAttribute('transform','translate('+(-(t*8)%1100)+' 0)');
    nodes.ripples.setAttribute('transform','translate('+(-(t*10)%100)+' 0)');
    nodes.gulls.setAttribute('transform','translate('+Math.sin(t*.5)*9+' '+Math.sin(t*1.8)*4+')');
    nodes.breeze.setAttribute('opacity',String(.45+Math.sin(phase)*.2));
    nodes.shadow.setAttribute('rx',String(210-bob*1.8));
    const wave = Math.sin(phase*2.2)*5;
    nodes.scarfTail.setAttribute('d','M530 235c-29 '+(-10+wave)+'-47 '+(-21+wave)+'-75 '+(-12+wave)+'l7 10-12 6c32-6 49 '+(13-wave)+' 72 '+(14-wave)+'Z');
  }
  function frame(now) {
    if(previous!==null && !paused && !document.hidden) time += Math.min((now-previous)/1000,.05)*speed;
    previous=now; render(time); requestAnimationFrame(frame);
  }
  syncButton(); render(0); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
