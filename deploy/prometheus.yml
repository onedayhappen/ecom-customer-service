global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/platform-alerts.yml
scrape_configs:
  - job_name: ecom-api
    dns_sd_configs:
      - names: [backend]
        type: A
        port: 8010
        refresh_interval: 15s
  - job_name: ecom-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9101
        refresh_interval: 15s
  - job_name: ecom-dispatcher
    dns_sd_configs:
      - names: [dispatcher]
        type: A
        port: 9102
        refresh_interval: 15s
