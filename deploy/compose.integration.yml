# Isolated integration infrastructure. Never points to business databases.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecom_operations_test
      MYSQL_USER: test_runner
      MYSQL_PASSWORD: isolated_test_only
      MYSQL_ROOT_PASSWORD: isolated_root_only
    ports: ["127.0.0.1:23306:3306"]
    tmpfs: ["/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pisolated_root_only"]
      interval: 2s
      timeout: 2s
      retries: 60
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecom_concurrency_test
      POSTGRES_USER: test_runner
      POSTGRES_PASSWORD: isolated_test_only
    ports: ["127.0.0.1:25432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_runner -d ecom_concurrency_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:26379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
