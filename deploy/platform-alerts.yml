groups:
  - name: ecom-runtime
    rules:
      - alert: EcomDurableStoreUnavailable
        expr: platform_store_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Runtime database cannot be queried"
      - alert: EcomQueueWaitTooLong
        expr: max(platform_oldest_waiting_job_seconds) > 60
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Accepted jobs have waited over 60 seconds; inspect workers and downstream capacity"
      - alert: EcomNotificationsStalled
        expr: time() - max(platform_runtime_last_success_unixtime{role="notifications"}) > 60
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "No notification publisher has completed an iteration recently"
      - alert: EcomTaskWorkerStalled
        expr: time() - max(platform_runtime_last_success_unixtime{role="worker"}) > 60
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "No task worker has completed an iteration recently"
      - alert: EcomDatabasePoolSaturated
        expr: sum(rate(platform_db_pool_timeouts_total[5m])) > 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Database connection waits are timing out"
      - alert: EcomUnknownExecutions
        expr: max(platform_business_operations{status="unknown"}) > 0
        labels: {severity: warning}
        annotations:
          summary: "Execution outcomes require human verification; do not replay writes"
      - alert: EcomRuntimeTargetDown
        expr: up{job=~"ecom-api|ecom-worker|ecom-dispatcher"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "An API, worker or dispatcher scrape target is down"
