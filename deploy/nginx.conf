# Docker DNS resolves all backend replica addresses at startup. Reload nginx
# after changing replica counts so it refreshes the upstream address list.
upstream chat_api {
    server backend:8010;
    keepalive 32;
}

server {
    listen 80;
    # Includes multipart framing; decoded file size is enforced by the API.
    client_max_body_size 11m;
    location / {
        proxy_pass http://chat_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 15s;
    }
}
