services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecom_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecom_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecom_agent_orders
      MYSQL_USER: ecom
      MYSQL_PASSWORD: ecom_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3307:3306"
    volumes:
      - ./.docker-data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 30

  order-init:
    image: ecom-customer-service-backend:latest
    env_file:
      - .env
    environment:
      ORDER_DB_DSN: mysql://ecom:ecom_dev_password@mysql:3306/ecom_agent_orders
    command: ["python", "scripts/migrate_mysql_business_schema.py"]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./.docker-data/app:/app/data

  backend:
    image: ecom-customer-service-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      API_SESSION_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/ecom_agent
      MEMORY_STORAGE_BACKEND: postgres
      MEMORY_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/ecom_agent
      MEMORY_REDIS_URL: redis://redis:6379/0
      ORDER_DB_DSN: mysql://ecom:ecom_dev_password@mysql:3306/ecom_agent_orders
      ORDER_CACHE_REDIS_URL: redis://redis:6379/0
      API_CONCURRENCY_REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    expose: ["8010"]
    volumes:
      - ./.docker-data/app:/app/data
      - ./.docker-data/logs:/app/logs
      - ${MODEL_DIR:-./model}:/app/model:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      order-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  gateway:
    image: nginx:1.28-alpine
    ports: ["8010:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    image: ecom-customer-service-backend:latest
    env_file:
      - .env
    environment:
      API_SESSION_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/ecom_agent
      MEMORY_STORAGE_BACKEND: postgres
      MEMORY_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/ecom_agent
      MEMORY_REDIS_URL: redis://redis:6379/0
      ORDER_DB_DSN: mysql://ecom:ecom_dev_password@mysql:3306/ecom_agent_orders
      ORDER_CACHE_REDIS_URL: redis://redis:6379/0
      API_CONCURRENCY_REDIS_URL: redis://redis:6379/0
      RUNTIME_METRICS_PORT: "9101"
      RUNTIME_METRICS_HOST: "0.0.0.0"
    command: ["python", "-m", "scripts.task_worker"]
    volumes:
      - ./.docker-data/app:/app/data
      - ./.docker-data/logs:/app/logs
      - ${MODEL_DIR:-./model}:/app/model:ro
    depends_on:
      backend:
        condition: service_healthy

  memory-worker:
    image: ecom-customer-service-backend:latest
    env_file: [.env]
    environment:
      API_SESSION_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/ecom_agent
      MEMORY_STORAGE_BACKEND: postgres
      MEMORY_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/ecom_agent
      MEMORY_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "scripts.memory_worker"]
    volumes:
      - ./.docker-data/app:/app/data
      - ./.docker-data/logs:/app/logs
      - ${MODEL_DIR:-./model}:/app/model:ro
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  commerce-worker:
    image: ecom-customer-service-backend:latest
    env_file: [.env]
    environment:
      ORDER_DB_DSN: mysql://ecom:ecom_dev_password@mysql:3306/ecom_agent_orders
    command: ["python", "-m", "scripts.commerce_worker"]
    volumes:
      - ./.docker-data/app:/app/data
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  dispatcher:
    image: ecom-customer-service-backend:latest
    env_file: [.env]
    environment:
      API_SESSION_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/ecom_agent
      API_CONCURRENCY_REDIS_URL: redis://redis:6379/0
      RUNTIME_METRICS_PORT: "9102"
      RUNTIME_METRICS_HOST: "0.0.0.0"
    command: ["python", "-m", "scripts.notification_worker"]
    depends_on:
      backend:
        condition: service_healthy

  maintenance:
    image: ecom-customer-service-backend:latest
    env_file: [.env]
    environment:
      API_SESSION_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/ecom_agent
      MEMORY_STORAGE_BACKEND: postgres
      MEMORY_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/ecom_agent
      MEMORY_REDIS_URL: redis://redis:6379/0
      API_CONCURRENCY_REDIS_URL: redis://redis:6379/0
      ORDER_DB_DSN: mysql://ecom:ecom_dev_password@mysql:3306/ecom_agent_orders
    command: ["python", "-m", "scripts.platform_maintenance"]
    volumes:
      - ./.docker-data/app:/app/data
      - ./.docker-data/logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.2.1
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/platform-alerts.yml:/etc/prometheus/platform-alerts.yml:ro

  retrieval:
    profiles: ["remote-rag"]
    image: ecom-customer-service-backend:latest
    env_file: [.env]
    environment:
      API_CONCURRENCY_REDIS_URL: redis://redis:6379/0
      RETRIEVAL_SERVICE_URL: ""
    command: ["python", "-m", "uvicorn", "app.services.retrieval:app", "--host", "0.0.0.0", "--port", "8020"]
    volumes:
      - ./.docker-data/app:/app/data
      - ${MODEL_DIR:-./model}:/app/model:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8010
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_healthy
